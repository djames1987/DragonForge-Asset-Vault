[server]
bind = "0.0.0.0"
port = 8080
max_upload_bytes = 8589934592

[storage]
data_dir = "./data"
# Optional colder/larger storage tier. Keep this outside data_dir.
# archive_dir = "D:/DragonForge-Archive"

[database]
filename = "dragonforge.db"

[semantic]
enabled = true
ollama_url = "http://127.0.0.1:11434"
model = "nomic-embed-text"
semantic_weight = 0.70
keyword_weight = 0.30
max_results = 100


[backup]
directory = "./backups"
keep = 10
# Add one or more additional local/network-mounted replication roots:
# replication_targets = ["D:/DragonForge-Backup", "//NAS/DragonForge"]
