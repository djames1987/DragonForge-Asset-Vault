<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">DragonForge Asset Vault</title><desc id="desc">A dark geometric banner showing a desktop asset workflow connected to a LAN server, metadata database, and content-addressed storage.</desc><rect width="1200" height="300" rx="28" fill="#090b10"/><rect x="22" y="22" width="1156" height="256" rx="22" fill="#11141b" stroke="#202632" stroke-width="2"/><path d="M88 73 H172 V169 H88 Z" fill="none" stroke="#ff8a2b" stroke-width="8"/><path d="M102 139 L124 115 L141 132 L158 103" fill="none" stroke="#ff8a2b" stroke-width="7" stroke-linecap="round"/><text x="220" y="102" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">DragonForge Asset Vault</text><text x="220" y="144" fill="#8d96a8" font-family="Segoe UI, Arial, sans-serif" font-size="22">Game-development assets • revisions • attribution • projects • local AI search</text><rect x="220" y="181" width="185" height="48" rx="10" fill="#171b24" stroke="#ff8a2b"/><text x="312" y="211" text-anchor="middle" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="17">Desktop Client</text><path d="M405 205 H485" stroke="#8d96a8" stroke-width="3"/><rect x="485" y="181" width="160" height="48" rx="10" fill="#171b24"/><text x="565" y="211" text-anchor="middle" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="17">LAN Server</text><path d="M645 205 H725" stroke="#8d96a8" stroke-width="3"/><rect x="725" y="181" width="160" height="48" rx="10" fill="#171b24"/><text x="805" y="211" text-anchor="middle" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="17">SQLite</text><path d="M885 205 H965" stroke="#8d96a8" stroke-width="3"/><rect x="965" y="181" width="155" height="48" rx="10" fill="#171b24"/><text x="1042" y="211" text-anchor="middle" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="17">Asset Store</text></svg>