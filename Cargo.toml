[package]
name = "dragonforge-asset-vault"
version = "0.2.0"
edition = "2021"
description = "LAN-first game asset storage vault"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.31"
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "stream"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[[bin]]
name = "dragonforge-server"
path = "src/main.rs"

[[bin]]
name = "dragonforge-client"
path = "src/bin/dragonforge-client.rs"
